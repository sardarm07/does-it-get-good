repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^src/getgood/charts/vendor/  # vendored files stay byte for byte
      - id: trailing-whitespace
        exclude: ^src/getgood/charts/vendor/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-data-files
        name: no data files
        entry: IMDb data files must never be committed
        language: fail
        files: '(\.tsv\.gz|\.parquet|\.duckdb)$'
