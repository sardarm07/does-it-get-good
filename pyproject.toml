[project]
name = "getgood"
version = "0.0.0"
description = "Finds where a TV series gets good, slumps or gets review-bombed, from IMDb's datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sardar Khan", email = "74492148+sardarm07@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "typer>=0.27.3",
]

[project.scripts]
getgood = "getgood.cli:app"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["–"]  # en dash in episode ranges such as S1E1–S1E6

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "jsonschema>=4.26.0",
    "pre-commit>=4.6.2",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
