# Turning points that fans widely agree on, used to score getgood's verdicts with
# `make validate`. These are labels, not IMDb data. A show passes when every fact listed
# for it holds:
#
#   gets_good_at     the verdict is "gets good", within 3 episodes of this one
#   good_from_start  the verdict is "good from the start" or "steady"
#   slump_from       a slump starts within 3 episodes of this one
#   low_point        a low point falls within 1 episode of this one
#
# Shows without one agreed turning point, such as Seinfeld (fans name season 2, 3 or 4),
# are left out on purpose.

