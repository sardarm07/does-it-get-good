# Review bombs on IMDb since 2022 that the press documented, used to score getgood's bomb
# detector with `make validate`. These are labels, not IMDb data. A bomb is found when the
# show has a review-bomb event that touches one of its titles within its dates:
#
#   titles     "series" for the series page, an episode like S1E3, or a season like S4
#              for any of its episodes
#   from, to   the days the coverage places it, from the release to the last report
#
# A bomb whose dates the history holds no days for is reported but not scored.
# The coverage often disputes how much was coordinated and how much honest dislike; the
# notes say so where it does.

- id: tt10857160
  title: "She Hulk: Attorney at Law"
  titles: [series]
  from: 2022-08-15
  to: 2022-08-31
  note: >-
    Rated 1 or 10 in near-equal shares around its premiere on 18 August 2022, the 1s
    mostly from men over 30.
  sources:
    - https://thedirect.com/article/she-hulk-disney-review-bombed
    - https://insidethemagic.net/2022/08/she-hulk-review-bombed-men-marvel-jc1/

- id: tt7631058
