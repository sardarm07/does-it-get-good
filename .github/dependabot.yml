version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [chore, "area:infra"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: [chore, "area:infra"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      python:
        update-types: [minor, patch]
